<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twitch Volume Balance</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <p class="eyebrow">TWITCH</p>
          <h1>Volume Balance</h1>
        </div>
        <label class="switch" title="拡張機能を有効にする">
          <input id="enabled" type="checkbox" checked>
          <span></span>
        </label>
      </header>

      <section id="loading" class="state-card">Twitch と接続しています…</section>

      <section id="unsupported" class="state-card hidden">
        <strong>Twitch の配信またはアーカイブページを開いてください</strong>
        <span>すでに開いている場合は、拡張機能の追加後にページを再読み込みします。</span>
      </section>

      <section id="controls" class="hidden">
        <div class="channel-row">
          <div>
            <span class="label">現在のチャンネル</span>
            <strong id="channelName">—</strong>
          </div>
          <span id="connection" class="status">待機中</span>
        </div>

        <div class="meter-card">
          <div class="value-row">
            <span>音量補正</span>
            <output id="gainValue" for="gain">100%</output>
          </div>
          <input id="gain" type="range" min="0" max="200" step="5" value="100" aria-label="音量補正">
          <div class="scale"><span>0</span><span>100</span><span>200%</span></div>
          <div class="live-meter" aria-label="現在の出力レベル">
            <div class="meter-label"><span>出力レベル</span><output id="meterValue">待機</output></div>
            <div class="meter-track"><span id="meterFill"></span></div>
          </div>
        </div>

        <div class="presets" aria-label="プリセット">
          <button type="button" data-gain="0.75">75%</button>
          <button type="button" data-gain="1">100%</button>
          <button type="button" data-gain="1.25">125%</button>
          <button type="button" data-gain="1.5">150%</button>
        </div>

        <p class="hint">設定はこのチャンネル専用として保存され、次回から自動で適用されます。</p>
        <div id="warning" class="warning hidden" role="status"></div>

        <details class="shortcuts">
          <summary>キーボードショートカット</summary>
          <div class="shortcut-grid">
            <span>5%上げる</span><kbd data-mac="⌘">Alt</kbd><b>＋</b><kbd>Shift</kbd><b>＋</b><kbd>↑</kbd>
            <span>5%下げる</span><kbd data-mac="⌘">Alt</kbd><b>＋</b><kbd>Shift</kbd><b>＋</b><kbd>↓</kbd>
            <span>100%に戻す</span><kbd data-mac="⌘">Alt</kbd><b>＋</b><kbd>Shift</kbd><b>＋</b><kbd>0</kbd>
            <span>有効切替</span><kbd data-mac="⌘">Alt</kbd><b>＋</b><kbd>Shift</kbd><b>＋</b><kbd>M</kbd>
          </div>
        </details>

        <footer>
          <button id="reset" class="text-button" type="button">このチャンネルをリセット</button>
          <button id="openOptions" class="text-button" type="button">保存済み一覧</button>
        </footer>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
